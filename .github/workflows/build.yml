name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "9.0.x"
      - name: Install FFmpeg for integration tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test against Jellyfin 10.11.6
        run: dotnet test -c Release --logger "trx;LogFileName=tests.trx"
      - name: Package preview
        shell: pwsh
        run: ./build-plugin.ps1
      - name: Smoke-test bundled Linux tools without FUSE
        run: |
          mkdir -p /tmp/jellyfin-compressor-preview
          unzip -q artifacts/jellyfin-compressor-0.1.11.0.zip -d /tmp/jellyfin-compressor-preview
          chmod +x /tmp/jellyfin-compressor-preview/tools/*
          ln -s mkvtoolnix.AppImage /tmp/jellyfin-compressor-preview/tools/mkvmerge
          ln -s mkvtoolnix.AppImage /tmp/jellyfin-compressor-preview/tools/mkvextract
          /tmp/jellyfin-compressor-preview/tools/hdr10plus_tool --version
          APPIMAGE_EXTRACT_AND_RUN=1 /tmp/jellyfin-compressor-preview/tools/mkvmerge --version
          APPIMAGE_EXTRACT_AND_RUN=1 /tmp/jellyfin-compressor-preview/tools/mkvextract --version
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: jellyfin-compressor-preview
          path: |
            artifacts/*.zip
            artifacts/*.sha256
